#cloud-config
# Installs Docker and a swap file. The app's source is copied to /opt/ccs afterwards by deploy-vm.sh (the repository is private,
# so the VM cannot clone it), which then runs infra/azure/vm/bootstrap.sh with the domain.
package_update: true
packages: [docker.io, docker-compose-v2, python3, openssl]
runcmd:
  # Swap, so the Rails image build does not run out of memory on a small VM
  - fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - mkdir -p /opt/ccs && chown azureuser:azureuser /opt/ccs
  - touch /var/lib/cloud/ccs-ready
