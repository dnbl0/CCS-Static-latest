en:
  blacklight:
    application_name: 'Collection Navigator'
    # The range filters' fields, after Airbnb's price range
    range_limit:
      range_begin_short: From
      range_end_short: To
    search:
      # The names of the result views: button names, tooltips and the screen reader captions
      view:
        list: List view
        masonry: Mosaic view
      fields:
        sort:
          relevance: relevance
          date-desc: date (newest)
          date-asc: date (oldest)
          title: title (A-Z)
          title-desc: title (Z-A)
      # Record and result field labels carry no trailing colon (the static CCS design)
      show:
        label: "%{label}"
      index:
        label: "%{label}"
      facets:
        more_html: Show more <span class="visually-hidden">%{field_name}</span>
      # The option and the button share one label, so "per page" is said once: menu items show the number and are named
      # "40 results per page"; the button shows the words too (components/results_toolbar.css), dropping "results" on phones
      per_page:
        label: '%{count}<span class="visually-hidden"><span class="per-page__results"> results</span> per page</span>'
        button_label: "%{count}"
        button_label_html: "%{count}"
      zero_results:
        title: No results found and no suggestions are available for this search phrase.
        hint: Try different or broader search terms.
        new_search: Start a new search
        # The search finds records, but none of them match its filters (ZeroResults)
        filtered_title: No results match your filters.
        without_default_filter:
          one: "1 result without the ‘With a digital asset’ filter"
          other: "%{total} results without the ‘With a digital asset’ filter"
        without_filters:
          one: "1 result without these filters"
          other: "%{total} results without these filters"
        clear_filters: Clear all filters
      # Titles of the filter sections in the Field labels and filters workbook (facet groups)
      facets-collection_details:
        title: Collection details
      facets-creator:
        title: Creator
      facets-object:
        title: Object
      facets-subject_topic:
        title: Subject / Topic
      facets-copyright_advisory:
        title: Copyright & Advisory
      facets-access:
        title: Access
      facets-media_type:
        title: Media type
