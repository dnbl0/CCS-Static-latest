load_defaults: 9.0.0
development:
  adapter: solr
  # Fail rather than hang: the pages answer "search is unavailable" (see CatalogController#search_unavailable)
  open_timeout: 5
  timeout: 20
  url: <%= ENV['SOLR_URL'] || "http://127.0.0.1:8983/solr/blacklight-core" %>
test: &test
  adapter: solr
  # Fail rather than hang: the pages answer "search is unavailable" (see CatalogController#search_unavailable)
  open_timeout: 5
  timeout: 20
  url: <%= ENV['SOLR_URL'] || "http://127.0.0.1:8983/solr/blacklight-core" %>
production:
  adapter: solr
  # Fail rather than hang: the pages answer "search is unavailable" (see CatalogController#search_unavailable)
  open_timeout: 5
  timeout: 20
  url: <%= ENV['SOLR_URL'] || "http://127.0.0.1:8983/solr/blacklight-core" %>
