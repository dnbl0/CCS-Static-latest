collections:
  grainger-museum:
    menu_label: Grainger Museum Collection
    facet_value: Grainger Museum Collection
    name: Grainger Museum Collection
    blurb: The personal collection of composer Percy Grainger including instruments, manuscripts, correspondence
      and experimental machines.
    banner: grainger-museum.jpg
    about: Australian musician and composer Percy Grainger established the Grainger Museum in 1938, motivated
      by the desire to interpret and contextualise his creative achievements and cultural environment.
      The Grainger Museum Collection, an internationally significant archive of over 100,000 items, spans
      a range of disciplines, from experimental sound technology and musical instruments to costumes,
      ethnography, art and design. The collection is brought to life through collaboration with students,
      academic partners and artists and their creative work and production.
    advisory: null
    details:
    - label: Holding institution
      value: Grainger Museum
    - label: Languages
      value: English
    - label: Formats held
      value: Instruments, Manuscripts, Correspondence
    visit:
    - label: Opening hours
      paragraphs:
      - Open Monday, 1-4pm
    - label: Location
      paragraphs:
      - Gate 13, Royal Parade<br/>Parkville, Melbourne
    - label: Getting here
      paragraphs:
      - 'Car: Grainger Museum does not have designated parking. Parking is available at Royal Parade Car
        Park and you can find metered street parking on Royal Parade.'
      - 'Train: The nearest train station is Parkville, exit to Royal Parade East.'
      - 'Tram: The nearest tram stops are Stop 10 Royal Melbourne Hospital &amp; Royal Parade and Stop
        12 Morrah Street &amp; Royal Parade on route 19.'
      - 'Bus: Route 505 stops nearby on Royal Parade.'
      - 'Bicycle: Bike parking hoops are available behind Grainger Museum and on Royal Parade.'
      - 'Car pick-up and drop-off: cars can stop nearby along Royal Parade. Accessible parking bays are
        located on Royal Parade, between Genetics Lane and Tin Alley.'
    - label: Accessibility
      paragraphs:
      - Grainger Museum is step-free and accessible to mobility equipment users.
      - Limited bench seating is available in the museum.
      - A step-free, self-contained, all-gender toilet stall with baby changing facilities is available.
        The nearest Changing Places facility is located at Parkville Station.
    visit_url: https://grainger.unimelb.edu.au/visit
    website:
      url: https://storeroom.its.unimelb.edu.au/umc/grainger?page=collection-areas
      summary: Opening hours, exhibitions, events and visitor information.
  harry-brookes-allen-museum:
    menu_label: Harry Brookes Allen Museum
    facet_value: Harry Brookes Allen Museum of Anatomy and Pathology
    name: Harry Brookes Allen Museum of Anatomy and Pathology
    blurb: Anatomical and pathological specimens, models and teaching collections supporting medical education
      and research.
    banner: harry-brookes-allen-museum.jpg
    about: The Harry Brookes Allen Museum of Anatomy and Pathology is one of Australia's largest collections
      of human tissue specimens, animal anatomy specimens and historical anatomical models, offering students
      and researchers a unique insight into the human body. Although the museum is not normally open to
      the public, tours of the museum are available for biology and medical professionals and students.
    advisory: Contains medical/anatomical content advisory.
    details:
    - label: Holding institution
      value: Department of Anatomy and Physiology
    - label: Languages
      value: English
    - label: Formats held
      value: Specimens, Models
    visit:
    - label: Visitors information
      paragraphs:
      - The Harry Brookes Allen Museum of Anatomy and Pathology is not open to the general public. Swipe
        card access is provided to University of Melbourne students enrolled in relevant subjects.
    - label: Opening hours
      paragraphs:
      - 'Monday to Friday: 9:00am to 5:00pm'
      - Not open on weekends or University holidays.
    - label: Disability access
      paragraphs:
      - The Harry Brookes Allen Museum of Anatomy and Pathology is wheelchair accessible and welcomes
        visitors of all abilities. In some circumstances there are access limitations, please contact
        staff for more information.
      - For all tour and access enquiries, please contact the museum at <a class="contact-box__link" href="mailto:MDHS-museum@unimelb.edu.au">MDHS-museum@unimelb.edu.au</a>.
    - label: Location
      paragraphs:
      - University of Melbourne<br/>Medical Building<br/>Corner of Grattan Street and Royal Parade<br/>Parkville
        3052, Victoria.
      - The Museum is located on Level 3 East of the main Medical Building (Building 181). Wheelchair
        access, toilets, parking and cafes are available on campus.
    visit_url: https://harrybrookesallenmuseum.mdhs.unimelb.edu.au/about/visitors-info
    website:
      url: https://collections.mdhs.unimelb.edu.au/explore
      summary: Opening hours, exhibitions, events and visitor information.
  henry-forman-atkinson-dental-museum:
    menu_label: Henry Forman Atkinson Dental Museum
    facet_value: Henry Forman Atkinson Dental Museum
    name: Henry Forman Atkinson Dental Museum
    blurb: Instruments, equipment and teaching materials documenting the history of dentistry and oral
      health education.
    banner: henry-forman-atkinson-dental-museum.jpg
    about: Visit the Henry Forman Atkinson Dental Museum to be inspired by the intriguing history of dental
      health and development of the dental professions and dental education. It is the oldest and most
      significant dental collection in Australia. Tracing its origins back to 1884 with the formation
      of the Odontological Society of Victoria, the organization responsible for establishing the first
      dental school in Victoria.
    advisory: Contains medical content advisory.
    details:
    - label: Holding institution
      value: Melbourne Dental School
    - label: Languages
      value: English
    - label: Formats held
      value: Instruments, Equipment, Photographs
    visit:
    - label: Visitors information
      paragraphs:
      - The Henry Forman Atkinson Dental Museum offers FREE admission.
    - label: Exhibition tours
      paragraphs:
      - The Henry Forman Atkinson Dental Museum conducts tours of its exhibitions for university students,
        staff, alumni, secondary schools and the community. These tours are free.
      - For all enquiries, please contact the museum on <a class="contact-box__link" href="mailto:mhm-info@unimelb.edu.au">mhm-info@unimelb.edu.au</a>.
    - label: Opening hours
      paragraphs:
      - 9:00am – 5:00pm Monday to Friday
    - label: Disability access
      paragraphs:
      - The Henry Forman Atkinson Dental Museum is wheelchair accessible and welcomes visitors of all
        abilities. In some circumstances there are access limitations, please contact staff for more information.
      - For all enquiries, please contact the museum on <a class="contact-box__link" href="mailto:mhm-info@unimelb.edu.au">mhm-info@unimelb.edu.au</a>.
    - label: Location
      paragraphs:
      - Ground floor of the Royal Dental Hospital,<br/>720 Swanston St, Carlton.
      - Located in the dental hospital surrounded by student classrooms, the museum is available to students,
        patients, their families, and the general public.
    visit_url: https://henryformanatkinsondentalmuseum.mdhs.unimelb.edu.au/visitors-info
    website:
      url: https://collections.mdhs.unimelb.edu.au/explore
      summary: Opening hours, exhibitions, events and visitor information.
  medical-history-museum:
    menu_label: Medical History Museum
    facet_value: Medical History Museum
    name: Medical History Museum
    blurb: Historical medical instruments, teaching models, pathological specimens and records documenting
      medical education.
    banner: medical-history-museum.jpg
    about: Explore, inquire and enjoy the social history of medicine and its role in society through a
      diverse exhibition program. Visit the nineteenth century Savory and Moore Pharmacy complete with
      pharmaceutical jars and equipment. The Medical History Museum is a free museum for those inquisitive
      about medicine's contribution to scientific discovery and community well being.
    advisory: Aboriginal and Torres Strait Islander viewers are advised that this website may contain
      the image, voice, or name of deceased persons. We apologise for any distress that may occur.
    details:
    - label: Holding institution
      value: Faculty of Medicine, Dentistry and Health Sciences
    - label: Languages
      value: English
    - label: Formats held
      value: Instruments, Models, Specimens
    visit:
    - label: Exhibition tours
      paragraphs:
      - The Medical History Museum conducts free guided tours of our exhibitions for groups of 15 or more.
        These tours are for university students, staff, alumni, secondary schools and the community.
      - 'Tours are available by appointment. To inquire or book a tour, please contact: <a class="contact-box__link"
        href="mailto:mhm-info@unimelb.edu.au">mhm-info@unimelb.edu.au</a>'
    - label: Opening hours
      paragraphs:
      - Monday to Friday 10.00am to 5.00pm
    - label: Location
      paragraphs:
      - University of Melbourne<br/>233 Bouverie St<br/>Carlton, Victoria
      - For all enquiries, please contact the museum on <a class="contact-box__link" href="mailto:mhm-info@unimelb.edu.au">mhm-info@unimelb.edu.au</a>.
    visit_url: https://medicalhistorymuseum.mdhs.unimelb.edu.au/about/contact-us
    website:
      url: https://collections.mdhs.unimelb.edu.au/explore
      summary: Opening hours, exhibitions, events and visitor information.
  university-art-collection:
    menu_label: University Art Collection
    facet_value: University Art Collection
    name: University Art Collection
    blurb: A major university art collection featuring Australian and international works spanning painting,
      sculpture and works on paper.
    banner: university-art-collection.jpg
    about: The University of Melbourne Art Collection is the largest university-based art collection in
      Australia, comprising over 18,000 artworks. The collection includes major holdings of paintings,
      prints and drawings, ceramics and sculpture, including contemporary Australian art and Aboriginal
      and Torres Strait Islander art.
    advisory: null
    details:
    - label: Holding institution
      value: Potter Museum of Art
    - label: Languages
      value: English
    - label: Formats held
      value: Paintings, Sculpture, Works on paper
    visit:
    - label: Visitors information
      paragraphs:
      - The University Art Collection is not held in a single gallery. It is displayed in curated exhibitions
        across cultural venues and on campus, and is accessible through teaching and learning programs.
        The Michael Buxton Collection can be seen at Buxton Contemporary.
    - label: Collection access
      paragraphs:
      - If you wish to access the collections, view items, raise a general enquiry, or request an image,
        please submit a request via the <a class="contact-box__link" href="/contact">Access Request Form</a>.
      - Some collection items may not be suitable for digitisation due to factors such as age, fragility,
        copyright and other considerations. A fee may apply to image requests to recover digitisation
        costs for publication and commercial use.
    visit_url: https://museumsandcollections.unimelb.edu.au/collections/university-of-melbourne-art-collection
    website:
      url: https://storeroom.its.unimelb.edu.au/umc/art?page=collection-areas
      summary: Opening hours, exhibitions, events and visitor information.
