browse:
  intro: The University of Melbourne's cultural collections are unrivalled among Australian universities,
    spanning visual arts, cartography, medical history, zoology, archives and more, including significant
    collections of Aboriginal and Torres Strait Islander cultural heritage.
  collections:
  - slug: medical-history-museum
    name: Medical History Museum
    tile: tile-mhm.jpg
    blurb: Explore the social history of medicine and its role in society, including a nineteenth-century
      pharmacy complete with pharmaceutical jars and equipment.
  - slug: university-art-collection
    name: University Art Collection
    tile: tile-uac.jpg
    blurb: Paintings, prints, sculpture and decorative arts spanning classical antiquity to contemporary
      Australian practice.
  - slug: grainger-museum
    name: Grainger Museum Collection
    tile: tile-gmc.jpg
    blurb: The personal archive, instruments and scores of composer Percy Grainger, held in trust for
      scholarship worldwide.
  - slug: henry-forman-atkinson-dental-museum
    name: Henry Forman Atkinson Dental Museum
    tile: tile-dental.png
    blurb: The oldest and most significant dental collection in Australia, tracing the history of dental
      health and education from 1884.
  - slug: harry-brookes-allen-museum
    name: Harry Brookes Allen Museum of Anatomy and Pathology
    tile: tile-hba.jpg
    blurb: One of Australia's largest collections of human tissue specimens, animal anatomy specimens
      and historical anatomical models.
