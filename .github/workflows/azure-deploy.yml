name: Deploy to Azure Container Apps

# Builds the Rails and Solr images, pushes them to Azure Container Registry and rolls out the two Container Apps.
# Manual only for now (run it from the Actions tab).
#
# Everything is set EXCEPT the OIDC identity this workflow signs in as (azure/login below). AZURE_TENANT_ID,
# AZURE_SUBSCRIPTION_ID, AZURE_ACR_NAME, AZURE_RESOURCE_GROUP and AZURE_CONTAINERAPPS_ENV are all set as
# repository variables; AZURE_CLIENT_ID is not, so this workflow fails at the login step until it is. To finish
# the one-time setup (needs Owner or User Access Administrator on the ccs-service-experience-app resource
# group -- Contributor is not enough to grant another identity access):
#   1. az ad app create --display-name ccs-github-actions-deploy
#      (note the appId it prints -- that is AZURE_CLIENT_ID)
#   2. az ad sp create --id <appId>
#   3. az ad app federated-credential create --id <appId> --parameters '{
#        "name": "ccs-2026-mvp-main", "issuer": "https://token.actions.githubusercontent.com",
#        "subject": "repo:Enterprise-Services-Group/CCS-2026-MVP:ref:refs/heads/main",
#        "audiences": ["api://AzureADTokenExchange"] }'
#      (lets this repo's main-branch runs sign in as the app, with no stored secret)
#   4. az role assignment create --assignee <appId> --role Contributor \
#        --resource-group ccs-service-experience-app
#   5. gh variable set AZURE_CLIENT_ID --repo Enterprise-Services-Group/CCS-2026-MVP --body <appId>
# After that this workflow (or a copy of it triggered on push, if full automation is wanted) deploys without
# anyone running az by hand.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-deploy
  cancel-in-progress: false

env:
  ACR: ${{ vars.AZURE_ACR_NAME }}
  RG: ${{ vars.AZURE_RESOURCE_GROUP }}
  ENVNAME: ${{ vars.AZURE_CONTAINERAPPS_ENV }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push images
        run: |
          az acr login -n "$ACR"
          cd ead-ccs-test
          docker build --target ead-ccs -t "$ACR.azurecr.io/ccs-web:$GITHUB_SHA" .
          docker build --target solr -t "$ACR.azurecr.io/ccs-solr:$GITHUB_SHA" .
          docker push "$ACR.azurecr.io/ccs-web:$GITHUB_SHA"
          docker push "$ACR.azurecr.io/ccs-solr:$GITHUB_SHA"

      - name: Deploy Solr (internal, one replica, Azure Files at /var/solr)
        run: |
          if az containerapp show -n ccs-solr -g "$RG" -o none 2>/dev/null; then
            az containerapp update -n ccs-solr -g "$RG" --image "$ACR.azurecr.io/ccs-solr:$GITHUB_SHA" -o none
          else
            az containerapp create -n ccs-solr -g "$RG" --environment "$ENVNAME" \
              --image "$ACR.azurecr.io/ccs-solr:$GITHUB_SHA" --registry-server "$ACR.azurecr.io" --registry-identity system \
              --ingress internal --target-port 8983 --min-replicas 1 --max-replicas 1 -o none
            echo "Created ccs-solr. Mount the 'solr-data' share at /var/solr (see infra/azure/README.md) before indexing."
          fi

      - name: Deploy the Rails app
        run: |
          if az containerapp show -n ccs-web -g "$RG" -o none 2>/dev/null; then
            az containerapp update -n ccs-web -g "$RG" --image "$ACR.azurecr.io/ccs-web:$GITHUB_SHA" -o none
          else
            echo "::warning::ccs-web does not exist yet; create it once with infra/azure/README.md step 3."
          fi
