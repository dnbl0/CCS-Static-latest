name: Deploy to GitHub Pages

# Builds public/ into dist/ with scripts/build-pages.js and publishes it with GitHub Pages whenever main changes.
# The base path comes from actions/configure-pages, so the same workflow works for a project site
# (https://<org>.github.io/<repo>/), an access-restricted site, or a custom domain.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Pages is enabled on the org repo only; on a fork or personal copy this workflow does nothing
    if: github.repository == 'Enterprise-Services-Group/CCS-2026-MVP'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: node scripts/build-pages.js
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.repository == 'Enterprise-Services-Group/CCS-2026-MVP'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
