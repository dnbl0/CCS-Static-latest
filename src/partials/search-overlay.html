<div id="uom-search-popover" class="uom-search-popover" role="dialog" aria-modal="true" aria-labelledby="uom-search-overlay-title">
  <div class="uom-search-popover__inner">
    <h2 id="uom-search-overlay-title" class="sr-only uom-search-popover__heading">Search</h2>
    <form class="uom-search-popover__form" role="search" action="/search/search-results.html" method="get">
      <label for="uom-search-overlay-input" class="sr-only uom-search-popover__label-search-cultural-collections">Search Cultural Collections</label>
      <input class="uom-search-overlay-input" id="uom-search-overlay-input" name="q" type="text" placeholder="Search" autocomplete="off">
      <button type="submit" class="uom-search-popover__submit" aria-label="Search">
        <svg class="uom-search-popover__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
    </form>
    <button type="button" class="uom-search-popover__close" id="uom-search-popover-close" aria-label="Close search">
      <svg class="uom-search-popover__icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
      <span class="uom-search-popover__text">Close</span>
    </button>
  </div>
</div>
<script>
(function(){
  document.addEventListener('click', function(e){
    var toggle = e.target.closest && e.target.closest('.uom-menu-toggle');
    if (toggle) {
      var header = toggle.closest('[data-component="Header"]');
      var nav = header && header.querySelector('.uom-primary-nav');
      if (!nav) return;
      var expanded = toggle.getAttribute('aria-expanded') === 'true';
      toggle.setAttribute('aria-expanded', expanded ? 'false' : 'true');
      nav.classList.toggle('is-open', !expanded);
      return;
    }
    var openToggle = document.querySelector('.uom-menu-toggle[aria-expanded="true"]');
    if (openToggle) {
      var openHeader = openToggle.closest('[data-component="Header"]');
      if (!openHeader || !openHeader.contains(e.target)) {
        openToggle.setAttribute('aria-expanded', 'false');
        var openNav = openHeader && openHeader.querySelector('.uom-primary-nav');
        if (openNav) openNav.classList.remove('is-open');
      }
    }
  });
  document.addEventListener('keydown', function(e){
    if (e.key !== 'Escape') return;
    var openToggle = document.querySelector('.uom-menu-toggle[aria-expanded="true"]');
    if (!openToggle) return;
    var openHeader = openToggle.closest('[data-component="Header"]');
    openToggle.setAttribute('aria-expanded', 'false');
    var openNav = openHeader && openHeader.querySelector('.uom-primary-nav');
    if (openNav) openNav.classList.remove('is-open');
    openToggle.focus();
  });

  // Full-screen search overlay. Elements are looked up live (never cached)
  // because this site's template layer can re-render the DOM after this
  // script runs, which would otherwise detach any cached references.
  var lastSearchTrigger = null;

  function openSearch(trigger) {
    var pop = document.getElementById('uom-search-popover');
    if (!pop) return;
    lastSearchTrigger = trigger || null;
    pop.classList.add('is-open');
    document.body.style.overflow = 'hidden';
    var input = document.getElementById('uom-search-overlay-input');
    if (input) input.focus();
  }
  function closeSearch() {
    var pop = document.getElementById('uom-search-popover');
    if (!pop) return;
    pop.classList.remove('is-open');
    document.body.style.overflow = '';
    if (lastSearchTrigger) lastSearchTrigger.focus();
  }

  document.addEventListener('click', function(e){
    var opener = e.target.closest && e.target.closest('[popovertarget="uom-search-popover"]');
    if (opener) {
      e.preventDefault();
      openSearch(opener);
      return;
    }
    var closer = e.target.closest && e.target.closest('#uom-search-popover-close');
    if (closer) closeSearch();
  });
  document.addEventListener('keydown', function(e){
    if (e.key !== 'Escape') return;
    var pop = document.getElementById('uom-search-popover');
    if (pop && pop.classList.contains('is-open')) closeSearch();
  });
})();
</script>
